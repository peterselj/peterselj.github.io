<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1b1b2f;
    color: #f4f4f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  a { color: #ff5470; font-weight: 600; }
</style>
<script>
  // Immediate JS redirect (belt-and-suspenders alongside the meta refresh above).
  // We redirect rather than iframe the form: Apps Script's HTML Service loads
  // the real content in its own nested sandbox iframe, and embedding that inside
  // a second iframe here gets blocked by third-party cookie/storage restrictions
  // in Brave, Safari, and Firefox strict mode. Redirecting keeps script.google.com
  // as the top-level page, which always works.
  window.location.replace(
    "https://script.google.com/macros/s/AKfycbyMU_miUBvTvIrY7I9KNEzbBiVLSQENPJVfQvpmZkhF0bGVAOzAcvUcg8HF-5IEXViv/exec"
  );
</script>
</head>

</body>
